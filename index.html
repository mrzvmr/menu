<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<title>Что на ужин?</title>
<style>
:root{--bg:#fff7f2;--card:#fff;--text:#2b2220;--muted:#8a7a74;--accent:#e4572e;--line:#f0dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1715;--card:#2a211e;--text:#f5ebe6;--muted:#a8958d;--accent:#ff7a50;--line:#3d2f2a}}
:root[data-theme="dark"]{--bg:#1d1715;--card:#2a211e;--text:#f5ebe6;--muted:#a8958d;--accent:#ff7a50;--line:#3d2f2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--text);padding:10px;border-radius:9px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dish{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;color:var(--text);font-size:15px}
.dish .e{font-size:34px;display:block;margin-bottom:4px}
.dish.sel{border-color:var(--accent)}
textarea{width:100%;margin-top:14px;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px;font:inherit;resize:none}
.send{width:100%;margin-top:10px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer}
.send:disabled{opacity:.45}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.big{font-size:44px;text-align:center}
.title{font-size:22px;font-weight:700;text-align:center}
.note{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);font-style:italic}
h2{font-size:16px;margin:0 0 10px}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
ul.ing li:last-child{border:0}
ul.ing li.done span{text-decoration:line-through;color:var(--muted)}
ol{padding-left:20px;margin:0}ol li{margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:8px}.top{font-size:14px;display:flex;gap:6px;align-items:center}
.toast{text-align:center;color:var(--accent);font-size:14px;margin-top:8px;min-height:20px}
.warn{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>мур мур мур 🍽️</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs">
    <button id="tabHe">Я — он 👨</button>
    <button id="tabShe">Я — она 👩‍🍳</button>
  </div>
  <div id="view"></div>
</div>
<script>
const TOPS=["Моцарелла","Пармезан","Чеддер","Горгонзола","Пепперони","Ветчина","Бекон","Курица","Креветки","Грибы","Сладкий перец","Помидоры","Красный лук","Маслины","Оливки","Кукуруза","Ананас","Халапеньо","Руккола","Базилик"];
const MENU=[
{id:"avotoast",e:"🥑",n:"Тосты с авокадо",ing:["Ржаной хлеб — 2 ломтика","Авокадо — 1 шт","Яйца — 2 шт","Черри — 6 шт","Страчателла — 100 г","Уксус, соль, перец, оливковое масло"],
 steps:["Подсушите хлеб на сковороде или в тостере.","Разомните авокадо с солью и перцем, намажьте на хлеб.","Сварите яйца пашот: в слабо кипящую воду с ложкой уксуса вылейте яйцо в воронку, 3 минуты.","Выложите страчателлу, половинки черри и яйцо пашот, полейте маслом."]},
{id:"buckegg",e:"🍳",n:"Гречка с яйцом и сыром",ing:["Гречка — 150 г","Яйца — 2 шт","Сыр — 50 г","Сливочное масло — 20 г","Соль"],
 steps:["Отварите гречку в двойном объёме подсоленной воды 15–20 минут.","Добавьте сливочное масло.","Пожарьте яйца или сварите всмятку.","Подавайте гречку с яйцом и тёртым сыром сверху."]},
{id:"tomyam",e:"🍤",n:"Том ям",ing:["Креветки — 200 г","Кальмар — 200 г","Паста том ям — 2–3 ст.л.","Кокосовые сливки — 200 мл","Шампиньоны — 150 г","Черри — 6 шт","Рис — 150 г","Вода — 700 мл"],
 steps:["Отварите рис отдельно.","Разведите пасту том ям в кипящей воде, добавьте нарезанные грибы, варите 5 минут.","Положите креветки и нарезанных кальмаров на 2–3 минуты, затем черри.","Влейте кокосовые сливки, прогрейте без кипения. Подавайте с рисом."]},
{id:"potcass",e:"🥔",n:"Картофельная запеканка",ing:["Фарш — 400 г","Картофель — 700 г","Сыр — 100 г","Майонез — 4 ст.л.","Соль, перец"],
 steps:["Нарежьте картофель тонкими кружками, посолите.","Выложите слоями: картофель, фарш с солью и перцем, смазывайте майонезом.","Закройте фольгой, запекайте при 190 °C 45 минут.","Посыпьте сыром и запекайте без фольги ещё 10–15 минут."]},
{id:"rucola",e:"🥬",n:"Салат с руколой и креветками",ing:["Руккола — 100 г","Черри — 10 шт","Моцарелла — 125 г","Креветки — 200 г","Оливковое масло — 3 ст.л.","Соль, перец"],
 steps:["Обжарьте креветки в масле 2–3 минуты, посолите.","Разрежьте черри пополам, моцареллу порвите руками.","Смешайте всё с рукколой, заправьте маслом, солью и перцем."]},
{id:"meatsoup",e:"🍲",n:"Суп с фрикадельками",ing:["Фарш — 300 г","Лук — 2 шт","Морковь — 1 шт","Картофель — 3 шт","Овсяные хлопья — 2 ст.л.","Вода — 1.5 л","Соль, лавровый лист"],
 steps:["Смешайте фарш, половину тёртого лука, овсянку и соль, слепите фрикадельки.","Доведите воду до кипения, добавьте картофель кубиками.","Через 10 минут положите фрикадельки и обжаренные лук с морковью.","Варите ещё 10–15 минут, добавьте лавровый лист."]},
{id:"cheesesoup",e:"🧀",n:"Сырный суп с курицей и шампиньонами",ing:["Куриные бёдра — 2–3 шт","Плавленый сыр — 2 шт","Картофель — 3 шт","Морковь — 1 шт","Лук — 1 шт","Шампиньоны — 200 г","Вода — 1.8 л","Соль, перец"],
 steps:["Сварите бульон из бёдер 25 минут, достаньте мясо, разберите.","Добавьте картофель кубиками.","Обжарьте лук, морковь и грибы, отправьте в суп через 10 минут.","Добавьте плавленый сыр, мешайте до растворения, верните курицу, посолите."]},
{id:"hedgehogs",e:"🦔",n:"Ёжики с рисом в сметане",ing:["Фарш — 500 г","Рис — 100 г","Сметана — 200 г","Лук — 1 шт","Кориандр сушёный — 1 ч.л.","Соль, перец, вода"],
 steps:["Отварите рис до полуготовности.","Смешайте фарш, рис, лук, кориандр, соль и перец, слепите шарики.","Обжарьте шарики до корочки.","Смешайте сметану с водой, залейте ёжиков, тушите под крышкой 25 минут."]},
{id:"buckpesto",e:"🌿",n:"Гречка с песто",ing:["Гречка — 150 г","Песто — 3 ст.л.","Пармезан — 30 г","Соль"],
 steps:["Отварите гречку 15–20 минут.","Смешайте с песто, пока горячая.","Подавайте с тёртым пармезаном."]},
{id:"chickensheet",e:"🍗",n:"Куриная грудка в листах для жарки",ing:["Куриная грудка — 2 шт","Листы для жарки","Соль, перец, паприка","Чеснок — 2 зубчика"],
 steps:["Нарежьте грудку на стейки, слегка отбейте, натрите специями и чесноком.","Выложите на лист для жарки в сухую сковороду.","Жарьте на среднем огне по 6–7 минут с каждой стороны, переворачивая вместе с листом."]},
{id:"chickenfried",e:"🍖",n:"Куриная грудка жареная",ing:["Куриная грудка — 2 шт","Масло растительное — 2 ст.л.","Соль, перец, паприка"],
 steps:["Нарежьте грудку на стейки и слегка отбейте.","Посолите и посыпьте специями.","Обжарьте на разогретом масле по 5–6 минут с каждой стороны, дайте отдохнуть 3 минуты."]},
{id:"mashed",e:"🥣",n:"Картофельное пюре",ing:["Картофель — 800 г","Сливочное масло — 50 г","Молоко — 150 мл","Соль"],
 steps:["Отварите очищенный картофель в солёной воде 20 минут.","Слейте воду, разомните.","Добавьте тёплое молоко и масло, взбейте до гладкости."]},
{id:"friedpot",e:"🍟",n:"Жареная картошка",ing:["Картофель — 700 г","Масло растительное — 3 ст.л.","Лук — 1 шт","Соль, перец"],
 steps:["Нарежьте картофель брусочками, промойте и обсушите.","Жарьте в масле на сильном огне 10 минут, не мешая.","Убавьте огонь, добавьте лук, жарьте ещё 10 минут, в конце посолите."]},
{id:"pasta",e:"🍝",n:"Паста карбонара",ing:["Спагетти — 200 г","Бекон или гуанчале — 100 г","Яйца — 2 шт + 1 желток","Пармезан — 50 г","Чёрный перец, соль"],
 steps:["Отварите спагетти до al dente, оставьте полстакана воды от варки.","Обжарьте нарезанный бекон без масла до хруста.","Смешайте яйца, желток, пармезан и перец.","Снимите сковороду с огня, добавьте пасту, затем яичную смесь, разбавляя водой от пасты."]},
{id:"omelet",e:"🍳",n:"Омлет с сыром и зеленью",ing:["Яйца — 4 шт","Молоко — 50 мл","Сыр — 60 г","Зелень — пучок","Сливочное масло — 10 г","Соль"],
 steps:["Взбейте яйца с молоком и солью.","Растопите масло на сковороде.","Вылейте смесь, через минуту посыпьте сыром и зеленью.","Накройте крышкой на 2–3 минуты, сложите пополам."]},
{id:"chicken",e:"🥘",n:"Курица с картошкой в духовке",ing:["Куриные бёдра — 4 шт","Картофель — 600 г","Чеснок — 3 зубчика","Паприка — 1 ч.л.","Оливковое масло — 3 ст.л.","Соль, перец"],
 steps:["Разогрейте духовку до 200 °C.","Смешайте масло, паприку, чеснок, соль и перец.","Обмажьте курицу и нарезанный картофель, выложите на противень.","Запекайте 45–50 минут."]},
{id:"burger",e:"🍔",n:"Домашние бургеры",ing:["Говяжий фарш — 400 г","Булочки — 4 шт","Чеддер — 4 ломтика","Помидор, салат, красный лук","Соус (майонез + кетчуп)","Соль, перец"],
 steps:["Сформируйте 4 котлеты, посолите и поперчите.","Жарьте по 3–4 минуты с каждой стороны, в конце положите сыр.","Подсушите булочки.","Соберите: соус, салат, котлета с сыром, помидор, лук."]},
{id:"salad",e:"🥗",n:"Салат Цезарь со шницелем",ing:["Куриное филе — 2 шт","Яйцо — 1 шт","Мука — 3 ст.л.","Панировочные сухари — 100 г","Масло для жарки","Салат романо — 1 кочан","Сухарики — 1 горсть","Пармезан — 40 г","Соус Цезарь — 4 ст.л."],
 steps:["Нарежьте филе пластами, отбейте, посолите.","Обваляйте в муке, взбитом яйце и панировочных сухарях.","Обжарьте шницель в масле по 3–4 минуты с каждой стороны, нарежьте полосками.","Смешайте порванный салат с соусом, добавьте шницель, сухарики и пармезан."]},
{id:"syrniki",e:"🥞",n:"Сырники",ing:["Творог 5–9% — 500 г","Яйцо — 1 шт","Мука — 4 ст.л. + для обваливания","Сахар — 2–3 ст.л.","Ванильный сахар — 1 пакетик","Соль — щепотка","Масло для жарки","Сметана, джем или ягоды"],
 steps:["Разомните творог вилкой.","Добавьте яйцо, сахар, ванильный сахар, соль и муку, замесите густое тесто.","Сформируйте шайбы, обваляйте в муке.","Обжарьте на среднем огне по 3–4 минуты с каждой стороны."]},
{id:"lasagna",e:"🫕",n:"Лазанья",ing:["Листы лазаньи — 250 г","Фарш — 500 г","Томатная паста или пассата — 400 г","Лук — 1 шт","Чеснок — 2 зубчика","Молоко — 500 мл","Сливочное масло — 50 г","Мука — 50 г","Сыр (моцарелла или пармезан) — 200 г","Мускатный орех, соль, перец"],
 steps:["Обжарьте лук и чеснок, добавьте фарш и жарьте 7 минут, влейте томаты, тушите 15 минут, посолите.","Бешамель: растопите масло, всыпьте муку, через минуту тонкой струйкой влейте молоко, помешивая, варите 5 минут, добавьте соль и мускат.","Соберите в форме слоями: бешамель, листы, фарш, сыр, повторяя; сверху бешамель и много сыра.","Запекайте при 180 °C 35–40 минут, дайте постоять 10 минут."]},
{id:"cheesecake",e:"🍰",n:"Чизкейк",ing:["Песочное печенье — 200 г","Сливочное масло — 100 г","Сливочный сыр (филадельфия, маскарпоне) — 600 г","Сахар — 150 г","Яйца — 3 шт","Сметана — 150 г","Ванильный сахар — 1 пакетик","Лимонный сок — 1 ст.л."],
 steps:["Измельчите печенье, смешайте с растопленным маслом, утрамбуйте на дно формы, охладите 15 минут.","Взбейте сыр с сахаром, ванилью и лимонным соком, по одному добавьте яйца и сметану, не взбивая долго.","Вылейте на основу, выпекайте при 160 °C 50–60 минут, центр должен слегка дрожать.","Выключите духовку и оставьте на 1 час с приоткрытой дверцей, затем уберите в холодильник на 6–8 часов."]},
{id:"pearbuns",e:"🍐",n:"Творожные булочки с грушей и сыром",ing:["Творог — 250 г","Мука — 250 г","Яйцо — 1 шт","Сахар — 2 ст.л.","Разрыхлитель — 2 ч.л.","Сливочное масло — 50 г","Груша — 2 шт","Сыр (бри, дорблю или моцарелла) — 100 г","Соль — щепотка"],
 steps:["Смешайте творог, яйцо, сахар, соль, мягкое масло, затем муку с разрыхлителем, замесите мягкое тесто.","Груши и сыр нарежьте небольшими кубиками.","Разделите тесто на 8–10 частей, сформируйте лепёшки, в центр положите грушу и сыр, защипните края.","Выложите швом вниз на пергамент, смажьте яйцом или молоком, выпекайте при 190 °C 20–25 минут."]},
{id:"odzhakhuri",e:"🥘",n:"Оджахури",ing:["Картофель — 700 г","Свинина — 500 г","Помидоры — 3 шт","Лук — 2 шт","Кинза — пучок","Масло растительное — 3 ст.л.","Соль, перец, хмели-сунели"],
 steps:["Нарежьте свинину кусочками, обжарьте на сильном огне до румяности.","Добавьте нарезанный полукольцами лук, жарьте 5 минут.","Добавьте картофель кубиками, жарьте 10 минут, затем нарезанные помидоры, посолите и добавьте специи.","Тушите под крышкой 15–20 минут до мягкости картофеля, посыпьте кинзой."]},
{id:"hry",e:"🥡",n:"Хрючево",ing:[],steps:[]},
{id:"olivier_chicken",e:"🥗",n:"Оливье с куриным бедром",ing:["Куриные бёдра — 2 шт","Картофель — 3 шт","Морковь — 2 шт","Яйца — 4 шт","Солёные огурцы — 3 шт","Зелёный горошек консервированный — 150 г","Лук зелёный или репчатый — по вкусу","Майонез — 5 ст.л.","Соль, перец"],
 steps:["Отварите бёдра 25–30 минут в солёной воде, остудите, снимите кожу и нарежьте кубиком.","Отварите картофель и морковь в мундире до готовности, яйца 10 минут. Остудите и очистите.","Нарежьте картофель, морковь, яйца и огурцы мелким кубиком.","Смешайте всё с горошком и луком, заправьте майонезом, посолите, поперчите и охладите перед подачей."]},
{id:"olivier_sausage",e:"🥗",n:"Оливье с колбасой",ing:["Варёная колбаса — 300 г","Картофель — 3 шт","Морковь — 2 шт","Яйца — 4 шт","Солёные огурцы — 3 шт","Зелёный горошек консервированный — 150 г","Лук зелёный или репчатый — по вкусу","Майонез — 5 ст.л.","Соль, перец"],
 steps:["Отварите картофель и морковь в мундире до готовности, яйца 10 минут. Остудите и очистите.","Нарежьте колбасу, картофель, морковь, яйца и огурцы мелким кубиком.","Смешайте с горошком и луком, заправьте майонезом, посолите, поперчите и охладите перед подачей."]},
{id:"warmsalad",e:"🥗",n:"Тёплый салат с курицей су-вид, фасолью и грибами",ing:["Курица су-вид (готовое филе) — 250 г","Зелёная фасоль — 250 г","Кукуруза консервированная — 100 г","Шампиньоны — 200 г","Чеснок — 1 зубчик","Оливковое масло — 3 ст.л.","Соевый соус — 1 ст.л.","Лимонный сок — 1 ст.л.","Соль, перец"],
 steps:["Отварите фасоль 4–5 минут в кипящей солёной воде и сразу переложите в холодную воду, затем обсушите.","Нарежьте грибы пластинами, обжарьте в масле с чесноком 5–7 минут до золотистого цвета.","Нарежьте курицу су-вид ломтиками.","Смешайте фасоль, кукурузу, грибы и курицу, заправьте маслом, соевым соусом и лимонным соком, посолите и поперчите."]},
{id:"crabroll",e:"🦀",n:"Крабовый рулет",ing:["Тонкий лаваш — 1–2 листа","Крабовые палочки — 200 г","Плавленый или творожный сыр — 150 г","Яйца — 3 шт","Чеснок — 1–2 зубчика","Майонез — 3 ст.л.","Укроп — пучок"],
 steps:["Отварите яйца 10 минут, остудите и натрите на тёрке. Крабовые палочки и сыр тоже натрите или мелко нарежьте.","Смешайте яйца, крабовые палочки, сыр, выдавленный чеснок, рубленый укроп и майонез.","Разверните лаваш, равномерно распределите начинку и плотно сверните рулетом.","Заверните в плёнку и уберите в холодильник на 1–2 часа, затем нарежьте порционными кусками."]},
{id:"pizza",e:"🍕",n:"Пицца из слоёного теста",opts:TOPS,ing:["Слоёное тесто — 1 пласт","Томатный соус — 4 ст.л.","Сыр — 150 г"],
 steps:["Разогрейте духовку до 200 °C, разморозьте и раскатайте тесто, наколите вилкой.","Смажьте соусом, выложите начинку и сыр.","Выпекайте 15–20 минут до золотистого края."]}
];
const $=id=>document.getElementById(id);
let role=null,hry={base:null,sauce:new Set(),fill:new Set(),other:""},picks=new Set(),extras=new Set(),current=null,dbDoc=null,checked={};
try{role=localStorage.getItem("role")}catch(e){}
if(!role)role="he";

function setRole(r){role=r;try{localStorage.setItem("role",r)}catch(e){}render()}
$("tabHe").onclick=()=>setRole("he");
$("tabShe").onclick=()=>setRole("she");

function render(){
  $("tabHe").classList.toggle("on",role==="he");
  $("tabShe").classList.toggle("on",role==="she");
  $("sub").textContent=role==="he"?"Выбери одно или несколько блюд — она сразу увидит":"Здесь появится его выбор, продукты и рецепт";
  role==="he"?renderHe():renderShe();
}

const HB=["Рис","Булгур","Чечевица","Макароны"],HS=["Соевый соус","Сыр","Сливки","Терияки"],HF=["Фарш из мяса","Куриная грудка","Куриное бедро","Креветки","Шампиньоны","Говядина","Морковь"];
const HA={"Рис":"150 г","Булгур":"150 г","Чечевица":"150 г","Макароны":"200 г","Соевый соус":"2–3 ст.л.","Сыр":"80 г","Сливки":"150 мл","Терияки":"3 ст.л.","Фарш из мяса":"300 г","Куриная грудка":"300 г","Куриное бедро":"300 г","Креветки":"250 г","Шампиньоны":"200 г","Говядина":"300 г","Морковь":"1–2 шт"};
const HT={"Рис":"15–18 минут","Булгур":"12–15 минут","Чечевица":"20–25 минут","Макароны":"по времени на упаковке"};
function hryData(h){
  const b=h.base||"Рис",sa=h.sauce||[],fi=h.fill||[],ot=h.other||"";
  const ings=[b+" — "+HA[b]].concat(fi.map(x=>x+" — "+HA[x]),sa.map(x=>x+" — "+HA[x]),ot?[ot+" (другое)"]:[],["Масло для жарки, соль, перец"]);
  const st=["Отварите "+b.toLowerCase()+" ("+HT[b]+"), слейте воду."];
  if(fi.length||ot)st.push("Нарежьте и обжарьте начинку ("+fi.map(x=>x.toLowerCase()).concat(ot?[ot]:[]).join(", ")+"): мясо и курицу 8–10 минут до готовности, креветки 2–3 минуты, грибы и морковь 5–7 минут.");
  if(sa.length)st.push("Добавьте к начинке: "+sa.map(x=>x.toLowerCase()).join(", ")+(sa.includes("Сливки")?"; сливки прогрейте без кипения":"")+(sa.includes("Сыр")?"; сыр добавьте в конце, чтобы расплавился":"")+".");
  st.push("Смешайте с основой, прогрейте 2 минуты и подавайте.");
  return {ings,st};
}
const ids=c=>c?(c.dishIds||(c.dishId?[c.dishId]:[])):[];
function topsHtml(){const d=MENU.find(m=>m.id==="pizza");if(!picks.has("pizza"))return"";return '<div class="card" style="margin-top:14px"><h2>Начинка для пиццы 🍕</h2><div class="tops">'+d.opts.map(o=>`<label class="top"><input type="checkbox" data-o="${o}" ${extras.has(o)?"checked":""}>${o}</label>`).join("")+'</div></div>'}
function hryHtml(){if(!picks.has("hry"))return"";
  const g=(t,k,o)=>`<h2 style="margin-top:12px">${t}</h2><div class="tops">${o.map(x=>`<label class="top"><input type="checkbox" data-h="${k}" value="${x}" ${hry[k].has(x)?"checked":""}>${x}</label>`).join("")}</div>`;
  return '<div class="card" style="margin-top:14px"><h2>Хрючево 🥡 — собери сам</h2><h2 style="margin-top:8px">Основа (одна)</h2><div class="tops">'+HB.map(x=>`<label class="top"><input type="radio" name="hb" value="${x}" ${hry.base===x?"checked":""}>${x}</label>`).join("")+'</div>'+g("Соус / добавки","sauce",HS)+g("Начинка","fill",HF)+`<h2 style="margin-top:12px">Другое</h2><input id="hother" type="text" placeholder="Что ещё добавить?" value="${hry.other.replace(/"/g,"&quot;")}" style="width:100%;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit"></div>`}
function renderHe(){
  const v=$("view");
  v.innerHTML='<div class="grid">'+MENU.map(d=>`<button class="dish ${picks.has(d.id)?"sel":""}" data-id="${d.id}"><span class="e">${d.e}</span>${d.n}</button>`).join("")+
  '</div>'+topsHtml()+hryHtml()+'<textarea id="note" rows="2" placeholder="Пожелание (необязательно): поострее, без лука…"></textarea>'+
  '<button class="send" id="send" '+(picks.size?"":"disabled")+'>Отправить выбор'+(picks.size>1?" ("+picks.size+")":"")+' 💌</button><div class="toast" id="toast"></div>'+
  (ids(current).length?`<div class="warn">Сейчас отправлено: ${ids(current).map(i=>(MENU.find(m=>m.id===i)||{}).n).filter(Boolean).join(", ")}</div>`:"")+
  '<div class="warn">Можно выбрать несколько блюд</div>';
  v.querySelectorAll(".dish").forEach(b=>b.onclick=()=>{const i=b.dataset.id;picks.has(i)?picks.delete(i):picks.add(i);if(!picks.has("pizza"))extras.clear();const n=$("note").value;renderHe();$("note").value=n});
  v.querySelectorAll("input[data-o]").forEach(cb=>cb.onchange=()=>{cb.checked?extras.add(cb.dataset.o):extras.delete(cb.dataset.o)});
  v.querySelectorAll("input[name=hb]").forEach(r=>r.onchange=()=>{hry.base=r.value});
  v.querySelectorAll("input[data-h]").forEach(cb=>cb.onchange=()=>{const t=hry[cb.dataset.h];cb.checked?t.add(cb.value):t.delete(cb.value)});
  if($("hother"))$("hother").oninput=e=>{hry.other=e.target.value};
  $("send").onclick=async()=>{
    if(picks.has("hry")&&!hry.base){$("toast").textContent="Выбери основу для хрючева";return}
    if(!dbDoc){$("toast").textContent="Нет связи с базой — проверь интернет и правила в Firebase";return}
    try{await dbDoc.set({dishIds:[...picks],extras:picks.has("pizza")?[...extras]:[],hry:picks.has("hry")?{base:hry.base,sauce:[...hry.sauce],fill:[...hry.fill],other:hry.other.trim()}:null,note:$("note").value.trim(),ts:Date.now()});$("toast").textContent="Отправлено ✓"}
    catch(e){$("toast").textContent="Не удалось отправить: "+(e.message||e.code||"ошибка")}
  };
}

function renderShe(){
  const v=$("view");
  const ds=ids(current).map(i=>MENU.find(m=>m.id===i)).filter(Boolean);
  if(!ds.length){v.innerHTML='<div class="empty">Он пока ничего не выбрал 🤔<br>Как только выберет — всё появится здесь.</div>';return}
  const t=new Date(current.ts).toLocaleString("ru-RU",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"long"});
  let h=`<div class="card"><div class="big">${ds.map(d=>d.e).join(" ")}</div><div class="title">${ds.map(d=>d.n).join(" + ")}</div><div class="sub" style="text-align:center;margin:4px 0 0">выбрано ${t}</div>${current.note?`<div class="note">💬 ${esc(current.note)}</div>`:""}</div>`;
  ds.forEach(d=>{
    let ings=d.ing,st=d.steps;if(d.id==="pizza")ings=d.ing.concat((current.extras||[]).map(x=>x+" (начинка)"));if(d.id==="hry"){const r=hryData(current.hry||{});ings=r.ings;st=r.st}
    const c=checked[d.id+current.ts]||(checked[d.id+current.ts]={});
    h+=`<div class="card"><h2 style="font-size:19px">${d.e} ${d.n}</h2><h2>🛒 Продукты</h2><ul class="ing">${ings.map((x,i)=>`<li class="${c[i]?"done":""}"><input type="checkbox" data-k="${d.id}" data-i="${i}" ${c[i]?"checked":""}><span>${esc(x)}</span></li>`).join("")}</ul><h2 style="margin-top:14px">👩‍🍳 Рецепт</h2><ol>${st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
  });
  v.innerHTML=h;
  v.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{(checked[cb.dataset.k+current.ts])[cb.dataset.i]=cb.checked;cb.parentElement.classList.toggle("done",cb.checked)});
}
function esc(s){const x=document.createElement("div");x.textContent=s;return x.innerHTML}

render();
(function(){
  try{
    const ROOM="q2kvnh7bwupkgeenx2ry5msy";
    firebase.initializeApp({databaseURL:"https://am-am-fee71-default-rtdb.europe-west1.firebasedatabase.app"});
    const ref=firebase.database().ref("rooms/"+ROOM+"/current");
    dbDoc={set:o=>ref.set(o),onSnapshot:cb=>ref.on("value",sn=>{const v=sn.val();cb({exists:!!v,data:()=>v})},()=>{})};
    dbDoc.onSnapshot(s=>{current=s.exists?s.data():null;render()});
  }catch(e){$("sub").textContent="мур мур мур"}
})();
</script>
</body>
</html>
